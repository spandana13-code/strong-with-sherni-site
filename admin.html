<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Strong With Sherni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#2D322C; --cream:#FAF9F3; --white:#FFFFFF;
    --maroon:#7B0237; --teal:#1F4037; --coral:#FF833B; --mustard:#9C9C1E;
    --taupe:#6B6459; --line:rgba(45,50,44,0.13);
    --red:#DC2626; --orange:#D97706; --pink:#B0576F; --green:#4D8A1F; --gray:#9CA3AF;
  }
  *{box-sizing:border-box;}
  body{ font-family:'Work Sans', sans-serif; background:var(--cream); color:var(--ink); margin:0; }
  h1,h2,h3{ font-family:'Cormorant Garamond', serif; margin:0; }
  input, select, textarea{ font-family:'Work Sans', sans-serif; }
  .hidden{ display:none !important; }

  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .login-box{ width:100%; max-width:360px; }
  .login-brand{ text-align:center; margin-bottom:24px; }
  .login-brand .emoji{ font-size:36px; }
  .login-brand h1{ font-size:22px; color:var(--maroon); margin-top:4px; }
  .login-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
  .field{ margin-bottom:16px; }
  .field label{ font-size:12px; color:var(--taupe); display:block; margin-bottom:5px; font-weight:600; }
  .field input, .field select, .field textarea{ width:100%; padding:10px 12px; border:1px solid #D1D5DB; border-radius:8px; font-size:13.5px; background:var(--white); color:var(--ink); }
  .btn-primary{ background:var(--maroon); color:#fff; border:none; border-radius:8px; padding:11px 22px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .btn-secondary{ background:#fff; color:var(--ink); border:1px solid #D1D5DB; border-radius:8px; padding:11px 22px; cursor:pointer; font-size:13.5px; }
  .btn-wa{ background:#25D366; color:#fff; border:none; border-radius:8px; padding:5px 12px; cursor:pointer; font-size:12px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
  .error-msg{ font-size:12px; color:var(--red); margin-bottom:12px; padding:8px 12px; background:#FEE2E2; border-radius:6px; }

  #dashboard-screen{ padding:1.5rem clamp(1rem,4vw,3rem); }
  .dash-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .dash-header h1{ font-size:20px; color:var(--maroon); }
  .dash-header .sub{ font-size:12px; color:var(--taupe); margin-top:3px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .tabs{ display:flex; gap:4px; background:#EFEAE2; border-radius:10px; padding:4px; width:fit-content; margin-bottom:24px; }
  .tab-btn{ padding:8px 18px; font-size:13px; cursor:pointer; border:none; border-radius:8px; background:transparent; color:var(--taupe); font-weight:500; }
  .tab-btn.active{ background:var(--maroon); color:#fff; font-weight:600; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  .stat-card{ border-radius:10px; padding:14px 16px; }
  .stat-card .lbl{ font-size:11px; margin:0 0 4px; }
  .stat-card .val{ font-size:26px; font-weight:700; margin:0; }
  @media (max-width:700px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }

  .chart-grid{ display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:16px; margin-bottom:24px; }
  .chart-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .chart-card h4{ font-size:13px; font-weight:700; color:#374151; margin-bottom:14px; font-family:'Work Sans',sans-serif; }
  .chart-card .chart-wrap{ position:relative; height:220px; }
  .chart-card .empty-note{ text-align:center; color:var(--taupe); font-size:12.5px; padding-top:70px; }
  @media (max-width:960px){ .chart-grid{ grid-template-columns:1fr; } }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-row input, .filter-row select{ padding:9px 12px; border:1px solid #D1D5DB; border-radius:8px; font-size:13px; }
  .filter-row input{ flex:1; min-width:180px; }
  .expired-divider{ display:flex; align-items:center; gap:10px; margin:18px 0 4px; }
  .expired-divider span{ font-size:11px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:0.5px; }
  .expired-divider .line{ flex:1; height:1px; background:var(--line); }

  .client-card{ background:var(--white); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.04); margin-bottom:10px; }
  .client-top{ padding:16px 20px; }
  .client-row1{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .client-name{ font-size:15px; font-weight:700; margin:0; }
  .client-sub{ font-size:12px; color:var(--taupe); margin:3px 0 0; }
  .badges{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .badge{ font-size:11px; padding:2px 9px; border-radius:6px; font-weight:600; }
  .mini-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(95px,1fr)); gap:6px; margin-bottom:12px; }
  .mini-cell{ background:var(--cream); border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
  .mini-cell .k{ font-size:10px; color:#9CA3AF; margin:0 0 2px; }
  .mini-cell .v{ font-size:13px; font-weight:600; margin:0; }
  .call-status{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .call-badge{ font-size:12px; padding:3px 10px; border-radius:6px; font-weight:500; }
  .more-btn{ margin-left:auto; background:transparent; border:none; cursor:pointer; font-size:12px; color:var(--teal); font-weight:600; }
  .client-expand{ border-top:1px solid var(--line); padding:16px 20px; background:var(--cream); display:none; }
  .client-expand.open{ display:block; }
  .phase-btn{ padding:4px 12px; border-radius:6px; border:1px solid #D1D5DB; font-size:12px; cursor:pointer; background:#fff; color:var(--taupe); margin-right:6px; }
  .phase-btn.active{ background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600; }
  .edit-btn, .del-btn{ font-size:12px; padding:5px 12px; border-radius:8px; cursor:pointer; }
  .edit-btn{ background:#fff; border:1px solid #D1D5DB; color:var(--ink); }
  .del-btn{ background:transparent; border:none; color:var(--red); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:1rem; }
  .modal-box{ background:#fff; border-radius:16px; padding:1.75rem; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; }
  .modal-box h3{ font-size:17px; margin-bottom:20px; }
  .section-label{ font-size:12px; font-weight:700; color:var(--maroon); text-transform:uppercase; letter-spacing:0.5px; margin:0 0 10px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .form-grid .full{ grid-column:1/-1; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }

  .reminder-box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:12px; }
  .reminder-box.urgent{ background:#FCEBEB; border-color:#F09595; }
  .reminder-box.soon{ background:#FAEEDA; border-color:#FAC775; }
  .reminder-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
  .reminder-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(0,0,0,0.06); font-size:13px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="emoji">🦁</div>
      <h1>Strong With Sherni</h1>
      <p style="font-size:13px;color:var(--taupe);margin-top:4px;">Admin Dashboard</p>
    </div>
    <div class="login-card">
      <div class="field">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter admin username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password">
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <button class="btn-primary" style="width:100%;padding:12px;" onclick="handleLogin()">Login</button>
    </div>
  </div>
</div>

<div id="dashboard-screen" class="hidden">
  <div class="dash-header">
    <div>
      <h1>🦁 Strong With Sherni</h1>
      <p class="sub">Admin Dashboard <span id="save-status" style="color:var(--green);margin-left:6px;"></span></p>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" onclick="exportCSV()">↓ CSV</button>
      <button class="btn-primary" onclick="openAddModal()">+ Add Client</button>
      <button class="btn-secondary" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
    <button class="tab-btn" data-tab="clients" onclick="switchTab('clients')">Clients</button>
    <button class="tab-btn" data-tab="reminders" onclick="switchTab('reminders')">Reminders</button>
  </div>

  <div id="tab-overview"></div>
  <div id="tab-clients" class="hidden"></div>
  <div id="tab-reminders" class="hidden"></div>
</div>

<div id="client-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modal-title">Add New Client</h3>

    <p class="section-label">Basic Info</p>
    <div class="form-grid">
      <div class="full field"><label>Full name *</label><input id="f-name"></div>
      <div class="field"><label>Login email *</label><input id="f-email" type="email"></div>
      <div class="field"><label>Password *</label><input id="f-password"></div>
      <div class="full field"><label>Phone (for WhatsApp reminders)</label><input id="f-phone" placeholder="+91 XXXXX XXXXX"></div>
    </div>

    <p class="section-label">Programme</p>
    <div class="form-grid">
      <div class="field"><label>Join date *</label><input id="f-join" type="date"></div>
      <div class="field"><label>Payment date</label><input id="f-payment" type="date"></div>
      <div class="field"><label>Duration</label>
        <select id="f-duration"><option>3 months</option><option>6 months</option><option>12 months</option></select>
      </div>
      <div class="field"><label>Current phase</label>
        <select id="f-phase"><option>Phase 1</option><option>Phase 2</option><option>Phase 3</option><option>Phase 4</option></select>
      </div>
      <div class="field"><label>Pause days</label><input id="f-pause" type="number" min="0" value="0"></div>
      <div class="field"><label>Extension days</label><input id="f-ext" type="number" min="0" value="0"></div>
      <div class="field"><label>Referral bonus days</label><input id="f-ref" type="number" min="0" value="0"></div>
      <div class="field"><label>Payment status</label>
        <select id="f-paystatus"><option value="pending">Pending</option><option value="paid">Paid</option></select>
      </div>
    </div>

    <p class="section-label">Onboarding</p>
    <div class="form-grid">
      <div class="field"><label>Onboarding date</label><input id="f-onboard-date" type="date"></div>
      <div>
        <div class="checkbox-row"><input type="checkbox" id="f-intro"> Intro call done</div>
        <div class="checkbox-row"><input type="checkbox" id="f-onboard"> Onboarding call done</div>
      </div>
    </div>

    <p class="section-label">Notes</p>
    <textarea id="f-notes" style="width:100%;min-height:64px;padding:10px;border:1px solid #D1D5DB;border-radius:8px;font-size:13px;"></textarea>

    <div id="modal-error" class="error-msg hidden" style="margin-top:12px;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveClient()">Save</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://mvhuwsmcsubfdowukoyn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ZBLQx4UlBiN3GWSzsZtYTg_tjNimgzE";
  const ADMIN_CREDS = { username: "sherni", password: "admin123" };
  const DURATIONS = { "3 months": 90, "6 months": 180, "12 months": 365 };
  const STRIPE_COLOR = { critical:"#DC2626", warning:"#D97706", soon:"#B0576F", active:"#4D8A1F", expired:"#9CA3AF", unknown:"#D1D5DB" };

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let clients = [];
  let editingId = null;

  function calcEnd(c){
    if(!c.join_date) return null;
    const d = new Date(c.join_date);
    d.setDate(d.getDate() + DURATIONS[c.duration] + Number(c.pause_days||0) + Number(c.extension_days||0) + Number(c.referral_days||0));
    return d;
  }
  function daysLeft(end){ if(!end) return null; return Math.ceil((end - new Date())/86400000); }
  function fmt(date){ if(!date) return "—"; return new Date(date).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
  function statusGroup(c){
    const d = daysLeft(calcEnd(c));
    if(d===null) return "unknown"; if(d<0) return "expired"; if(d<=7) return "critical"; if(d<=14) return "warning"; if(d<=30) return "soon"; return "active";
  }
  function waLink(phone, msg){
    if(!phone) return null;
    const digits = phone.replace(/\D/g,"");
    const withCountry = digits.length===10 ? "91"+digits : digits;
    return `https://wa.me/${withCountry}?text=${encodeURIComponent(msg)}`;
  }

  function handleLogin(){
    const u = document.getElementById("login-username").value.trim();
    const p = document.getElementById("login-password").value;
    const err = document.getElementById("login-error");
    if(u===ADMIN_CREDS.username && p===ADMIN_CREDS.password){
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dashboard-screen").classList.remove("hidden");
      loadClients();
      return;
    }
    err.textContent = "Invalid credentials. Please try again.";
    err.classList.remove("hidden");
  }
  function handleLogout(){
    document.getElementById("dashboard-screen").classList.add("hidden");
    document.getElementById("login-screen").classList.remove("hidden");
    document.getElementById("login-username").value = "";
    document.getElementById("login-password").value = "";
  }

  async function loadClients(){
    const { data, error } = await sb.from("clients").select("*").order("created_at",{ascending:true});
    if(error){ alert("Error loading clients: "+error.message); return; }
    clients = data || [];
    renderAll();
  }
  function flashSave(msg){
    const el = document.getElementById("save-status");
    el.textContent = msg;
    setTimeout(()=>el.textContent="",2000);
  }

  function switchTab(tab){
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
    ["overview","clients","reminders"].forEach(t=>{
      document.getElementById("tab-"+t).classList.toggle("hidden", t!==tab);
    });
    renderAll();
  }

  function renderAll(){
    renderOverview();
    renderClients();
    renderReminders();
  }

  let chartStatus, chartPhase, chartPayment;

  function renderOverview(){
    const total = clients.length;
    const active = clients.filter(c=>statusGroup(c)==="active").length;
    const critical = clients.filter(c=>statusGroup(c)==="critical").length;
    const warning = clients.filter(c=>statusGroup(c)==="warning").length;
    const soon = clients.filter(c=>statusGroup(c)==="soon").length;
    const expiring = critical + warning + soon;
    const expired = clients.filter(c=>statusGroup(c)==="expired").length;
    const introPending = clients.filter(c=>!c.intro_done).length;
    const onboardPending = clients.filter(c=>!c.onboarding_done).length;
    const paid = clients.filter(c=>c.payment_status==="paid").length;
    const pending = clients.filter(c=>c.payment_status!=="paid").length;
    const phaseCounts = ["Phase 1","Phase 2","Phase 3","Phase 4"].map(p=>clients.filter(c=>(c.phase||"Phase 1")===p).length);

    document.getElementById("tab-overview").innerHTML = `
      <p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;">Programme Status</p>
      <div class="stat-grid">
        <div class="stat-card" style="background:#fff;border:1px solid var(--line);"><p class="lbl" style="color:#111827;">Total</p><p class="val" style="color:#111827;">${total}</p></div>
        <div class="stat-card" style="background:#EAF3DE;"><p class="lbl" style="color:#3B6D11;">Active</p><p class="val" style="color:#3B6D11;">${active}</p></div>
        <div class="stat-card" style="background:#FAEEDA;"><p class="lbl" style="color:#854F0B;">Expiring ≤30d</p><p class="val" style="color:#854F0B;">${expiring}</p></div>
        <div class="stat-card" style="background:#FCEBEB;"><p class="lbl" style="color:#A32D2D;">Expired</p><p class="val" style="color:#A32D2D;">${expired}</p></div>
      </div>

      <p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;">At a Glance</p>
      <div class="chart-grid">
        <div class="chart-card">
          <h4>Client Status Breakdown</h4>
          <div class="chart-wrap">${total===0?'<p class="empty-note">No clients yet</p>':'<canvas id="chart-status"></canvas>'}</div>
        </div>
        <div class="chart-card">
          <h4>Clients per Phase</h4>
          <div class="chart-wrap">${total===0?'<p class="empty-note">No clients yet</p>':'<canvas id="chart-phase"></canvas>'}</div>
        </div>
        <div class="chart-card">
          <h4>Payment Status</h4>
          <div class="chart-wrap">${total===0?'<p class="empty-note">No clients yet</p>':'<canvas id="chart-payment"></canvas>'}</div>
        </div>
      </div>

      <p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;">Onboarding Status</p>
      <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);">
        <div class="stat-card" style="background:#FBEAF0;"><p class="lbl" style="color:#993556;">Intro Call Pending</p><p class="val" style="color:#993556;">${introPending}</p></div>
        <div class="stat-card" style="background:#FBEAF0;"><p class="lbl" style="color:#993556;">Onboarding Call Pending</p><p class="val" style="color:#993556;">${onboardPending}</p></div>
      </div>
    `;

    if(total===0) return;

    [chartStatus, chartPhase, chartPayment].forEach(c=>c && c.destroy());

    chartStatus = new Chart(document.getElementById("chart-status"), {
      type: "doughnut",
      data: {
        labels: ["Active","Ending ≤7d","Ending ≤14d","Ending ≤30d","Expired"],
        datasets: [{ data:[active,critical,warning,soon,expired], backgroundColor:["#4D8A1F","#DC2626","#D97706","#B0576F","#9CA3AF"], borderWidth:0 }]
      },
      options: { plugins:{ legend:{ position:"bottom", labels:{ font:{ size:11 }, boxWidth:10, padding:8 } } }, maintainAspectRatio:false }
    });

    chartPhase = new Chart(document.getElementById("chart-phase"), {
      type: "bar",
      data: {
        labels: ["Phase 1","Phase 2","Phase 3","Phase 4"],
        datasets: [{ data: phaseCounts, backgroundColor: ["#5B21B6","#1E40AF","#166534","#854D0E"], borderRadius:6 }]
      },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1, font:{size:11} } }, x:{ ticks:{ font:{size:11} } } }, maintainAspectRatio:false }
    });

    chartPayment = new Chart(document.getElementById("chart-payment"), {
      type: "doughnut",
      data: {
        labels: ["Paid","Pending"],
        datasets: [{ data:[paid,pending], backgroundColor:["#3B6D11","#D97706"], borderWidth:0 }]
      },
      options: { plugins:{ legend:{ position:"bottom", labels:{ font:{ size:11 }, boxWidth:10, padding:8 } } }, maintainAspectRatio:false }
    });
  }

  function renderClients(){
    const search = (document.getElementById("filter-search")?.value || "").toLowerCase();
    const statusF = document.getElementById("filter-status")?.value || "all";
    const phaseF = document.getElementById("filter-phase")?.value || "all";

    let filtered = clients.filter(c=>{
      const ms = c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search);
      const g = statusGroup(c);
      const mf = statusF==="all" ? true : statusF==="active" ? g==="active" : statusF==="expiring" ? ["critical","warning","soon"].includes(g) : g==="expired";
      const mp = phaseF==="all" ? true : c.phase===phaseF;
      return ms && mf && mp;
    });

    filtered.sort((a,b)=>{
      const ra = statusGroup(a)==="expired"?1:statusGroup(a)==="unknown"?2:0;
      const rb = statusGroup(b)==="expired"?1:statusGroup(b)==="unknown"?2:0;
      if(ra!==rb) return ra-rb;
      const da = daysLeft(calcEnd(a)), db = daysLeft(calcEnd(b));
      if(ra===1) return (db??-Infinity)-(da??-Infinity);
      if(ra===2) return 0;
      return (da??Infinity)-(db??Infinity);
    });

    const firstExpiredIdx = filtered.findIndex(c=>statusGroup(c)==="expired");

    let html = `
      <div class="filter-row">
        <input id="filter-search" placeholder="Search by name or email…" oninput="renderClients()" value="${search}">
        <select id="filter-status" onchange="renderClients()">
          <option value="all" ${statusF==="all"?"selected":""}>All Status</option>
          <option value="active" ${statusF==="active"?"selected":""}>Active</option>
          <option value="expiring" ${statusF==="expiring"?"selected":""}>Expiring</option>
          <option value="expired" ${statusF==="expired"?"selected":""}>Expired</option>
        </select>
        <select id="filter-phase" onchange="renderClients()">
          <option value="all">All Phases</option>
          <option>Phase 1</option><option>Phase 2</option><option>Phase 3</option><option>Phase 4</option>
        </select>
      </div>
    `;

    if(filtered.length===0){
      html += `<div style="text-align:center;padding:3rem 0;color:var(--taupe);">${clients.length===0?"No clients yet. Add your first one!":"No clients match your filters."}</div>`;
    } else {
      filtered.forEach((c,idx)=>{
        const end = calcEnd(c);
        const days = daysLeft(end);
        const group = statusGroup(c);
        const needsAttention = ["critical","warning"].includes(group) && !c.onboarding_done;
        const wa = waLink(c.phone, `Hi ${c.name.split(" ")[0]}, this is a reminder from Strong With Sherni — your programme has ${days!==null?Math.max(0,days):"a few"} day(s) left. Let's chat about next steps!`);

        if(idx===firstExpiredIdx && firstExpiredIdx>0){
          html += `<div class="expired-divider"><span>Expired</span><div class="line"></div></div>`;
        }

        html += `
          <div class="client-card" style="border-left:4px solid ${STRIPE_COLOR[group]};">
            <div class="client-top">
              <div class="client-row1">
                <div>
                  <p class="client-name">${c.name}</p>
                  <p class="client-sub">${c.email}${c.phone?" · "+c.phone:""}</p>
                </div>
                <div class="badges">
                  ${needsAttention ? `<span class="badge" style="background:#FEE2E2;color:#B91C1C;">⚠ Needs Attention</span>` : ""}
                  <span class="badge" style="background:#EDE9FE;color:#5B21B6;">${c.phase||"Phase 1"}</span>
                  ${statusBadgeHtml(days)}
                  ${wa ? `<a href="${wa}" target="_blank" class="btn-wa">💬 WhatsApp</a>` : ""}
                  <span class="badge" style="background:${c.payment_status==='paid'?'#EAF3DE':'#FEF3C7'};color:${c.payment_status==='paid'?'#3B6D11':'#92400E'};">${c.payment_status==='paid'?'Paid':'Payment Pending'}</span>
                  <button class="edit-btn" onclick="openEditModal('${c.id}')">Edit</button>
                  <button class="del-btn" onclick="deleteClient('${c.id}')">Delete</button>
                </div>
              </div>
              <div class="mini-grid">
                <div class="mini-cell"><p class="k">Joined</p><p class="v">${fmt(c.join_date)}</p></div>
                <div class="mini-cell"><p class="k">Payment</p><p class="v">${fmt(c.payment_date)}</p></div>
                <div class="mini-cell"><p class="k">End Date</p><p class="v">${fmt(end)}</p></div>
                <div class="mini-cell"><p class="k">Days Left</p><p class="v">${days!==null?Math.max(0,days):"—"}</p></div>
                <div class="mini-cell"><p class="k">Pause</p><p class="v">${c.pause_days||0}d</p></div>
                <div class="mini-cell"><p class="k">Extension</p><p class="v">${c.extension_days||0}d</p></div>
                <div class="mini-cell"><p class="k">Referral</p><p class="v">${c.referral_days||0}d</p></div>
              </div>
              <div class="call-status">
                <span class="call-badge" style="background:${c.intro_done?'#EAF3DE':'#FBEAF0'};color:${c.intro_done?'#3B6D11':'#993556'};">${c.intro_done?"✓ Intro Call":"✗ Intro Call"}</span>
                <span class="call-badge" style="background:${c.onboarding_done?'#EAF3DE':'#FBEAF0'};color:${c.onboarding_done?'#3B6D11':'#993556'};">${c.onboarding_done?"✓ Onboarding Call":"✗ Onboarding Call"}</span>
                <button class="more-btn" onclick="toggleExpand('${c.id}')">▼ More details</button>
              </div>
            </div>
            <div class="client-expand" id="expand-${c.id}">
              <p style="font-size:12px;font-weight:600;color:#374151;margin-bottom:12px;">Quick Update</p>
              <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;">
                <label class="checkbox-row"><input type="checkbox" ${c.intro_done?"checked":""} onchange="quickUpdate('${c.id}',{intro_done:this.checked})"> Intro call done</label>
                <label class="checkbox-row"><input type="checkbox" ${c.onboarding_done?"checked":""} onchange="quickUpdate('${c.id}',{onboarding_done:this.checked})"> Onboarding call done</label>
              </div>
              <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:var(--taupe);margin-right:8px;">Phase:</label>
                ${["Phase 1","Phase 2","Phase 3","Phase 4"].map(p=>`<button class="phase-btn ${c.phase===p?'active':''}" onclick="quickUpdate('${c.id}',{phase:'${p}'})">${p}</button>`).join("")}
              </div>
              ${c.notes ? `<p style="font-size:12px;color:var(--taupe);padding:8px 10px;background:#fff;border-radius:6px;">${c.notes}</p>` : ""}
            </div>
          </div>
        `;
      });
    }
    document.getElementById("tab-clients").innerHTML = html;
  }
  function statusBadgeHtml(days){
    if(days===null) return "";
    if(days<0) return `<span class="badge" style="background:#F3F4F6;color:#6B7280;">Expired</span>`;
    if(days<=7) return `<span class="badge" style="background:#FCEBEB;color:#A32D2D;">Ends in ${days}d</span>`;
    if(days<=14) return `<span class="badge" style="background:#FAEEDA;color:#854F0B;">Ends in ${days}d</span>`;
    if(days<=30) return `<span class="badge" style="background:#FBEAF0;color:#993556;">Ends in ${days}d</span>`;
    return `<span class="badge" style="background:#EAF3DE;color:#3B6D11;">Active</span>`;
  }
  function toggleExpand(id){
    document.getElementById("expand-"+id).classList.toggle("open");
  }

  function renderReminders(){
    const introPending = clients.filter(c=>!c.intro_done);
    const onboardPending = clients.filter(c=>!c.onboarding_done);
    const exp7 = clients.filter(c=>{const d=daysLeft(calcEnd(c));return d!==null&&d>=0&&d<=7;});
    const exp30 = clients.filter(c=>{const d=daysLeft(calcEnd(c));return d!==null&&d>7&&d<=30;});

    let html = "";
    if(introPending.length){
      html += `<div class="reminder-box"><p class="reminder-title" style="color:#993556;">📞 Intro Call Pending (${introPending.length})</p>`;
      introPending.forEach(c=>{ html += `<div class="reminder-row"><span>${c.name}</span><button class="btn-primary" style="padding:4px 14px;font-size:12px;" onclick="quickUpdate('${c.id}',{intro_done:true})">Mark done</button></div>`; });
      html += `</div>`;
    }
    if(onboardPending.length){
      html += `<div class="reminder-box"><p class="reminder-title" style="color:#993556;">🎯 Onboarding Call Pending (${onboardPending.length})</p>`;
      onboardPending.forEach(c=>{ html += `<div class="reminder-row"><span>${c.name}</span><button class="btn-primary" style="padding:4px 14px;font-size:12px;" onclick="quickUpdate('${c.id}',{onboarding_done:true})">Mark done</button></div>`; });
      html += `</div>`;
    }
    if(exp7.length){
      html += `<div class="reminder-box urgent"><p class="reminder-title" style="color:#A32D2D;">🔴 Programme ending within 7 days (${exp7.length})</p>`;
      exp7.forEach(c=>{ const d=daysLeft(calcEnd(c)); html += `<div class="reminder-row" style="color:#A32D2D;"><span>${c.name}</span><span>${d}d left · ends ${fmt(calcEnd(c))}</span></div>`; });
      html += `</div>`;
    }
    if(exp30.length){
      html += `<div class="reminder-box soon"><p class="reminder-title" style="color:#854F0B;">🟡 Programme ending within 30 days (${exp30.length})</p>`;
      exp30.forEach(c=>{ const d=daysLeft(calcEnd(c)); html += `<div class="reminder-row" style="color:#854F0B;"><span>${c.name}</span><span>${d}d left · ends ${fmt(calcEnd(c))}</span></div>`; });
      html += `</div>`;
    }
    if(!introPending.length && !onboardPending.length && !exp7.length && !exp30.length){
      html = `<div style="text-align:center;padding:3rem 0;color:var(--taupe);">🎉 All clear! No pending reminders.</div>`;
    }
    document.getElementById("tab-reminders").innerHTML = html;
  }

  function openAddModal(){
    editingId = null;
    document.getElementById("modal-title").textContent = "Add New Client";
    ["f-name","f-email","f-password","f-phone","f-join","f-payment","f-onboard-date","f-notes"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("f-duration").value = "3 months";
    document.getElementById("f-phase").value = "Phase 1";
    document.getElementById("f-pause").value = 0;
    document.getElementById("f-ext").value = 0;
    document.getElementById("f-ref").value = 0;
    document.getElementById("f-paystatus").value = "pending";
    document.getElementById("f-intro").checked = false;
    document.getElementById("f-onboard").checked = false;
    document.getElementById("modal-error").classList.add("hidden");
    document.getElementById("client-modal").classList.remove("hidden");
  }
  function openEditModal(id){
    const c = clients.find(x=>x.id===id);
    if(!c) return;
    editingId = id;
    document.getElementById("modal-title").textContent = "Edit Client";
    document.getElementById("f-name").value = c.name;
    document.getElementById("f-email").value = c.email;
    document.getElementById("f-password").value = c.password;
    document.getElementById("f-phone").value = c.phone||"";
    document.getElementById("f-join").value = c.join_date||"";
    document.getElementById("f-payment").value = c.payment_date||"";
    document.getElementById("f-onboard-date").value = c.onboarding_date||"";
    document.getElementById("f-duration").value = c.duration;
    document.getElementById("f-phase").value = c.phase||"Phase 1";
    document.getElementById("f-pause").value = c.pause_days||0;
    document.getElementById("f-ext").value = c.extension_days||0;
    document.getElementById("f-ref").value = c.referral_days||0;
    document.getElementById("f-paystatus").value = c.payment_status||"pending";
    document.getElementById("f-intro").checked = c.intro_done||false;
    document.getElementById("f-onboard").checked = c.onboarding_done||false;
    document.getElementById("f-notes").value = c.notes||"";
    document.getElementById("modal-error").classList.add("hidden");
    document.getElementById("client-modal").classList.remove("hidden");
  }
  function closeModal(){ document.getElementById("client-modal").classList.add("hidden"); }

  async function saveClient(){
    const name = document.getElementById("f-name").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const password = document.getElementById("f-password").value;
    const joinDate = document.getElementById("f-join").value;
    const errEl = document.getElementById("modal-error");
    if(!name || !email || !password || !joinDate){
      errEl.textContent = "Name, email, password and join date are required.";
      errEl.classList.remove("hidden");
      return;
    }
    const payload = {
      name, email, password,
      phone: document.getElementById("f-phone").value.trim(),
      join_date: joinDate,
      payment_date: document.getElementById("f-payment").value || null,
      onboarding_date: document.getElementById("f-onboard-date").value || null,
      duration: document.getElementById("f-duration").value,
      phase: document.getElementById("f-phase").value,
      pause_days: Number(document.getElementById("f-pause").value)||0,
      extension_days: Number(document.getElementById("f-ext").value)||0,
      referral_days: Number(document.getElementById("f-ref").value)||0,
      payment_status: document.getElementById("f-paystatus").value,
      intro_done: document.getElementById("f-intro").checked,
      onboarding_done: document.getElementById("f-onboard").checked,
      notes: document.getElementById("f-notes").value
    };

    let error;
    if(editingId){
      ({ error } = await sb.from("clients").update(payload).eq("id", editingId));
    } else {
      ({ error } = await sb.from("clients").insert(payload));
    }
    if(error){ errEl.textContent = "Save failed: "+error.message; errEl.classList.remove("hidden"); return; }
    closeModal();
    flashSave("Saved ✓");
    await loadClients();
  }

  async function quickUpdate(id, patch){
    const { error } = await sb.from("clients").update(patch).eq("id", id);
    if(error){ alert("Update failed: "+error.message); return; }
    flashSave("Saved ✓");
    await loadClients();
  }

  async function deleteClient(id){
    if(!confirm("Delete this client?")) return;
    const { error } = await sb.from("clients").delete().eq("id", id);
    if(error){ alert("Delete failed: "+error.message); return; }
    await loadClients();
  }

  function exportCSV(){
    const headers = ["Name","Email","Phone","Phase","Duration","Join Date","Payment Date","Onboarding Date","Pause Days","Extension Days","Referral Days","End Date","Days Remaining","Payment Status","Intro Call","Onboarding Call","Notes"];
    const rows = clients.map(c=>{
      const end = calcEnd(c); const days = daysLeft(end);
      return [c.name,c.email,c.phone||"",c.phase||"",c.duration,fmt(c.join_date),fmt(c.payment_date),fmt(c.onboarding_date),c.pause_days||0,c.extension_days||0,c.referral_days||0,fmt(end),days!==null?Math.max(0,days):"",c.payment_status||"pending",c.intro_done?"Done":"Pending",c.onboarding_done?"Done":"Pending",c.notes||""];
    });
    const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download = "sherni-clients.csv";
    a.click();
  }
</script>
</body>
</html>
